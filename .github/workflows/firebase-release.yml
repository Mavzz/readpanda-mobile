name: Firebase - Release

# Manual only: each run takes 20+ minutes and emails every tester. It runs
# `yarn release` (fastlane/Fastfile) on master; setup is in docs/RUN.md.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (empty: feat/fix commits since the last release)"
        required: false
        type: string

# Two releases at once would race on device registration and the notes.
concurrency:
  group: firebase-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and distribute
    if: github.ref == 'refs/heads/master'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The release notes walk the history back to the last release.
          fetch-depth: 0

      # macos-latest can default to an older Xcode than the one on our Macs.
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      # All of these are git-ignored, so the lane's clean-tree check still passes.
      - name: Write config and credentials
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          printf '%s\n' "$ENV_PROD" > .env.prod
          printf '%s\n' "$GOOGLE_SERVICE_INFO" > ios/GoogleService-Info.plist
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase.json"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          cat > fastlane/.env <<EOF
          ASC_KEY_ID=$ASC_KEY_ID
          ASC_ISSUER_ID=$ASC_ISSUER_ID
          ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          FIREBASE_SERVICE_ACCOUNT=$RUNNER_TEMP/firebase.json
          FIREBASE_GROUPS=$FIREBASE_GROUPS
          CERT_P12_PATH=$RUNNER_TEMP/certs.p12
          CERT_P12_PASSWORD=$CERT_P12_PASSWORD
          SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN
          EOF

      - name: Build and distribute
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            yarn release notes:"$NOTES"
          else
            yarn release
          fi

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/firebase.json" "$RUNNER_TEMP/certs.p12" fastlane/.env
